
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }
    input, button {
      display: block;
      width: 95%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hotel Management System</h1>
    <h2>Guest Registration</h2>
    <form id="guestForm">
      <input type="text" placeholder="Guest Name" required>
      <input type="email" placeholder="Email" required>
      <button type="submit">Register Guest</button>
    </form>
    <p id="message"></p>
  </div>
  <script>
    document.getElementById("guestForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Guest registered successfully!";
    });
  </script>
</body>
</html>
